name: CI

on:
  push:
    branches: [main]
    tags: [v0.1.0]
  pull_request:
  workflow_dispatch:
    inputs:
      release_check:
        description: "Run the fail-closed v0.1.0 freeze gate before tagging"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (library, sample world, player)
        run: npm run build
      - name: Typecheck scripts
        run: npm run typecheck:scripts

      - name: Size report
        run: npm run size:report -- --strict --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify court hashes, deterministic generation and held package versions
        run: npx tsx scripts/freeze-technical.ts
      - name: Release freeze gate (release only)
        if: ${{ startsWith(github.ref, 'refs/tags/v0.1.0') || (github.event_name == 'workflow_dispatch' && inputs.release_check) }}
        run: npm run freeze:check --workspace @wgif/format
      - name: Sample worlds are reproducible and committed
        run: git diff --exit-code -- examples/court/court.wgif examples/worlds/*.wgif
      - name: Size summary
        run: |
          {
            echo "### WGIF sizes"
            echo "| artifact | bytes |"
            echo "|---|---|"
            echo "| examples/court/court.wgif | $(stat -c %s examples/court/court.wgif) |"
            for f in apps/player/dist/assets/*.js; do echo "| $f | $(stat -c %s "$f") |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wgif-player-dist
          path: |
            apps/player/dist
            examples/court/court.wgif
          retention-days: 14
